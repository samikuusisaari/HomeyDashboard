<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt Custom Homey WebUI</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            display: inline-block;
            min-width: 250px;
            margin: 20px;
        }
        h1 { color: #00e676; }
        input, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; display: block; width: 80%; max-width: 300px; margin: 10px auto; }
        button { background-color: #00e676; color: black; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Mitt Homey Dashboard</h1>
    <p>Direktanslutning till Homey Pro 2019!</p>

    <!-- Inmatningsruta för både Token och ID -->
    <div id="setup-box">
        <p>Konfigurera din instrumentpanel:</p>
        <input type="password" id="api-key-input" placeholder="Klistra in din Personal Access Token (PAT)...">
        <input type="text" id="homey-id-input" placeholder="Ange ditt Homey ID (24 tecken)...">
        <button onclick="saveCredentials()">Anslut till min Homey</button>
    </div>

    <div class="card">
        <h3>Vardagsrum</h3>
        <p id="status">Väntar på konfiguration...</p>
    </div>

    <script>
        function saveCredentials() {
            const key = document.getElementById('api-key-input').value;
            const id = document.getElementById('homey-id-input').value;
            
            if(key && id) {
                localStorage.setItem('homey_pat_token', key.trim());
                localStorage.setItem('homey_id', id.trim());
                location.reload(); 
            }
        }

        async function init() {
            const savedToken = localStorage.getItem('homey_pat_token');
            const savedID = localStorage.getItem('homey_id');
            
            if (savedToken && savedID) {
                document.getElementById('setup-box').style.display = 'none';
                document.getElementById('status').innerText = `Ansluter direkt till Homey Pro via säker molntunnel...`;

                try {
                    // Vi anropar din Homey Pro 2019 direkt via dess unika globala molnadress!
                    // Det här kringgår helt CORS-problemet och pratar med boxens systeminfo direkt.
                    const response = await fetch(`https://${savedID}.homeypro.net/api/manager/system/info`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${savedToken}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`Kunde inte nå boxen (Status ${response.status}). Kontrollera dina uppgifter.`);
                    }

                    const systemInfo = await response.json();
                    
                    // Om anropet lyckas skriver vi ut namnet på din Homey Pro 2019!
                    if (systemInfo && systemInfo.name) {
                        document.getElementById('status').innerText = `Ansluten till: ${systemInfo.name}`;
                    } else {
                        document.getElementById('status').innerText = "Kunde läsa från boxen, men hittade ingen systeminfo.";
                    }
                    
                } catch (error) {
                    document.getElementById('status').innerText = "Anslutningsfel: " + error.message;
                    console.error(error);
                }
            }
        }

        init();
    </script>
</body>
</html>
