<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt Custom Homey WebUI</title>
    
    <!-- Vi laddar in ett officiellt, fristående CDN-skript för Athom API -->
    <script src="https://jsdelivr.net"></script>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            display: inline-block;
            min-width: 250px;
            margin: 20px;
        }
        h1 { color: #00e676; }
        input, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; display: block; width: 80%; max-width: 300px; margin: 10px auto; }
        button { background-color: #00e676; color: black; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Mitt Homey Dashboard</h1>
    <p>Distansanslutning till Homey Pro 2019</p>

    <div id="setup-box">
        <p>Konfigurera din instrumentpanel:</p>
        <input type="password" id="api-key-input" placeholder="Klistra in din Personal Access Token (PAT)...">
        <input type="text" id="homey-id-input" placeholder="Ange ditt Homey ID...">
        <button onclick="saveCredentials()">Anslut till min Homey</button>
    </div>

    <div class="card">
        <h3>Vardagsrum</h3>
        <p id="status">Väntar på konfiguration...</p>
    </div>

    <script>
        function saveCredentials() {
            const key = document.getElementById('api-key-input').value;
            const id = document.getElementById('homey-id-input').value;
            
            if(key && id) {
                localStorage.setItem('homey_pat_token', key.trim());
                localStorage.setItem('homey_id', id.trim());
                location.reload(); 
            }
        }

        async function init() {
            const savedToken = localStorage.getItem('homey_pat_token');
            const savedID = localStorage.getItem('homey_id');
            
            if (savedToken && savedID) {
                document.getElementById('setup-box').style.display = 'none';
                document.getElementById('status').innerText = `Initierar säker molnanslutning...`;

                try {
                    // Vi initierar Athoms molnkoppling med de officiella nycklarna för öppna webbapplikationer
                    const cloud = new Athom.AthomCloudAPI({
                        clientId: '5a8d4ca6eb9f7a2c9d6ccf6d',
                        clientSecret: 'e3ace394af9f615857ceaa61b053f966ddcfb12a'
                    });

                    // Vi sätter din sparade PAT-token i sessionen
                    cloud.setToken({
                        access_token: savedToken,
                        token_type: 'bearer'
                    });

                    document.getElementById('status').innerText = `Hämtar din Homey Pro...`;

                    // Vi skapar en direktanslutning till din specifika Homey via Athoms säkra tunnel
                    const homey = await cloud.getHomey(savedID);
                    const homeyApi = await homey.connect();

                    // Vi hämtar systeminfo för att verifiera att vi är förbi alla CORS-spärrar!
                    const systemInfo = await homeyApi.system.getInfo();
                    
                    document.getElementById('status').innerText = `Ansluten till: ${systemInfo.name}`;
                    
                } catch (error) {
                    document.getElementById('status').innerText = "Anslutningsfel: " + error.message;
                    console.error(error);
                }
            }
        }

        init();
    </script>
</body>
</html>
