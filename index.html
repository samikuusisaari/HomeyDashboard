<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt Custom Homey WebUI</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            display: inline-block;
            min-width: 200px;
            margin: 20px;
        }
        h1 { color: #00e676; }
        input, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; }
        button { background-color: #00e676; color: black; font-weight: bold; cursor: pointer; }
        textarea { width: 80%; height: 150px; background: #000; color: #00e676; font-family: monospace; border: 1px solid #333; padding: 10px; }
    </style>
</head>
<body>

    <h1>Mitt Homey Dashboard</h1>
    
    <div id="setup-box">
        <p>Ange din Homey Personal Access Token (PAT):</p>
        <input type="password" id="api-key-input" placeholder="pat-apps-...">
        <button onclick="saveKey()">Anslut</button>
    </div>

    <div class="card">
        <h3>Systemfelsökning</h3>
        <p id="status">Väntar på token...</p>
    </div>

    <div id="debug-box" style="display:none;">
        <p>Kopiera din <b>Cloud ID</b> eller <b>remoteUrl</b> härifrån:</p>
        <textarea id="output" readonly></textarea>
    </div>

    <script>
        function saveKey() {
            const key = document.getElementById('api-key-input').value;
            if(key) {
                localStorage.setItem('homey_pat_token', key);
                location.reload(); 
            }
        }

        async function init() {
            const savedToken = localStorage.getItem('homey_pat_token');
            
            if (savedToken) {
                document.getElementById('setup-box').style.display = 'none';
                document.getElementById('status').innerText = `Hämtar din Homey-adress...`;

                try {
                    // Vi använder Athoms användar-endpoint för att lista din hårdvara
                    const response = await fetch('https://api.athom.com/user/me', {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${savedToken}`
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`Kunde inte hämta användarinfo (Status ${response.status})`);
                    }

                    const data = await response.json();
                    
                    if (data && data.homeys && data.homeys.length > 0) {
                        document.getElementById('status').innerText = "Hittade din Homey Pro!";
                        document.getElementById('debug-box').style.display = 'block';
                        
                        // Vi skriver ut all information om dina Homey-boxar i textrutan
                        document.getElementById('output').value = JSON.stringify(data.homeys, null, 2);
                    } else {
                        document.getElementById('status').innerText = "Hittade ingen Homey kopplad till din profil.";
                    }
                    
                } catch (error) {
                    document.getElementById('status').innerText = "Anslutningsfel: " + error.message;
                    console.error(error);
                }
            }
        }

        init();
    </script>
</body>
</html>
