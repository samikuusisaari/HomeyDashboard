<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt Custom Homey WebUI</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            display: inline-block;
            min-width: 200px;
            margin: 20px;
        }
        h1 { color: #00e676; }
        input, button { padding: 10px; margin: 10px; border-radius: 5px; border: none; }
        button { background-color: #00e676; color: black; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Mitt Homey Dashboard</h1>
    <p>Det här är grunden till mitt helt egna WebUI!</p>

    <!-- Inmatningsruta för din PAT-nyckel -->
    <div id="setup-box">
        <p>Ange din Homey Personal Access Token (PAT):</p>
        <input type="password" id="api-key-input" placeholder="pat-apps-...">
        <button onclick="saveKey()">Anslut</button>
    </div>

    <div class="card">
        <h3>Vardagsrum</h3>
        <p id="status">Väntar på token...</p>
    </div>

    <script>
        function saveKey() {
            const key = document.getElementById('api-key-input').value;
            if(key) {
                localStorage.setItem('homey_pat_token', key);
                location.reload(); 
            }
        }

        async function init() {
            const savedToken = localStorage.getItem('homey_pat_token');
            
            if (savedToken) {
                // Dölj inmatningsrutan om nyckeln finns
                document.getElementById('setup-box').style.display = 'none';
                document.getElementById('status').innerText = `Ansluter till Homey Pro via API...`;

                try {
                    // Vi gör ett direkt och rent HTTP-anrop till Homeys officiella moln-API utan krångliga bibliotek
                    const response = await fetch('https://athom.com', {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${savedToken}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        throw new Error(`Servern svarade med status ${response.status}`);
                    }

                    const data = await response.json();
                    
                    // Homey API returnerar en lista över dina Homeys. Vi plockar den första i listan.
                    if (data && data.length > 0) {
                        const myHomey = data[0];
                        document.getElementById('status').innerText = `Ansluten till: ${myHomey.name} (${myHomey.state})`;
                    } else {
                        document.getElementById('status').innerText = "Hittade ingen Homey kopplad till denna token.";
                    }
                    
                } catch (error) {
                    document.getElementById('status').innerText = "Anslutningsfel: " + error.message;
                    console.error(error);
                }
            }
        }

        // Starta anslutningen
        init();
    </script>
</body>
</html>
