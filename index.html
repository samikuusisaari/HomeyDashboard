<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitt Custom Homey WebUI</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 20px;
            display: inline-block;
            min-width: 250px;
            margin: 20px;
        }
        h1 { color: #00e676; }
        input, button { padding: 12px; margin: 10px; border-radius: 5px; border: none; display: block; width: 80%; max-width: 300px; margin: 10px auto; }
        button { background-color: #00e676; color: black; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-action { background-color: #2196F3; color: white; margin-top: 15px; width: 100%; }
        #status { color: #bbb; font-style: italic; }
    </style>
</head>
<body>

    <h1>Mitt Homey Dashboard</h1>
    <p>Distansstyrning via Webhooks</p>

    <!-- Inställningar för ditt Homey Cloud ID -->
    <div id="setup-box">
        <p>Mata in ditt Homey Cloud ID för att konfigurera sidan:</p>
        <input type="text" id="homey-id-input" placeholder="Ditt Homey Cloud ID (t.ex. 5c8a...)">
        <button onclick="saveID()">Spara inställningar</button>
    </div>

    <div class="card">
        <h3>Vardagsrum</h3>
        <p id="status">Väntar på konfigurering...</p>
        
        <!-- Den här knappen kommer att skicka en signal till din Homey! -->
        <button id="action-btn" class="btn-action" style="display:none;" onclick="triggerHomey()">Tänd / Släck</button>
    </div>

    <script>
        function saveID() {
            const id = document.getElementById('homey-id-input').value.trim();
            if(id) {
                localStorage.setItem('homey_cloud_id', id);
                location.reload(); 
            }
        }

        function init() {
            const savedID = localStorage.getItem('homey_cloud_id');
            if (savedID) {
                document.getElementById('setup-box').style.display = 'none';
                document.getElementById('action-btn').style.display = 'block';
                document.getElementById('status').innerText = "Klar att skicka kommandon!";
            }
        }

        async function triggerHomey() {
            const savedID = localStorage.getItem('homey_cloud_id');
            document.getElementById('status').innerText = "Skickar signal...";

            try {
                // Vi skickar ett anonymt, säkert webhook-anrop till din Homey.
                // Det här API:et är helt öppet för CORS och tillåts av alla webbläsare överallt!
                const response = await fetch(`https://homey.app{savedID}/Vardagsrum_Knapp`, {
                    method: 'GET',
                    mode: 'no-cors' // Detta talar om för webbläsaren att ignorera CORS-spärrar!
                });

                document.getElementById('status').innerText = "Signal skickad framgångsrikt!";
                
                // Återställ statusen efter 3 sekunder
                setTimeout(() => {
                    document.getElementById('status').innerText = "Klar att skicka kommandon!";
                }, 3000);

            } catch (error) {
                document.getElementById('status').innerText = "Fel: " + error.message;
            }
        }

        init();
    </script>
</body>
</html>
